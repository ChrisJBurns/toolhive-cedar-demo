apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPAuthzConfig
metadata:
  name: fetch-access
  namespace: toolhive-demo
spec:
  type: cedarv1
  config:
    policies:
      - 'permit(principal in THVGroup::"engineering", action == Action::"call_tool", resource == Tool::"fetch");'
    entities_json: '[]'
    group_claim_name: groups
