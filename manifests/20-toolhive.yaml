apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: dex
  namespace: toolhive-demo
spec:
  type: inline
  inline:
    issuer: http://dex.toolhive-demo.svc.cluster.local:5556/dex
    jwksUrl: http://dex.toolhive-demo.svc.cluster.local:5556/dex/keys
    clientId: toolhive-demo
    insecureAllowHTTP: true
    jwksAllowPrivateIP: true
    protectedResourceAllowPrivateIP: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mkp
  namespace: toolhive-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: toolhive-demo-mkp-cluster-admin
subjects:
  - kind: ServiceAccount
    name: mkp
    namespace: toolhive-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: demo-backends
  namespace: toolhive-demo
spec:
  description: Conference demo backends
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: mkp
  namespace: toolhive-demo
spec:
  groupRef:
    name: demo-backends
  image: ghcr.io/stackloklabs/mkp/server:0.4.3
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8080
  args:
    - --read-write=false
  serviceAccount: mkp
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github
  namespace: toolhive-demo
spec:
  groupRef:
    name: demo-backends
  image: ghcr.io/github/github-mcp-server:v1.12.2
  transport: stdio
  proxyPort: 8080
  secrets:
    - name: github-token
      key: token
      targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: cedar-demo
  namespace: toolhive-demo
spec:
  groupRef:
    name: demo-backends
  config:
    aggregation:
      conflictResolution: priority
      defaultToolVisibility: deny
      conflictResolutionConfig:
        priorityOrder:
          - mkp
          - github
      tools:
        - workload: mkp
          filter:
            - list_resources
        - workload: github
          filter:
            - add_issue_comment
            - issue_read
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: dex
      audience: toolhive-demo
      scopes:
        - openid
        - profile
        - email
        - groups
      resourceUrl: http://127.0.0.1:4483/mcp
    authzConfigRef:
      name: resources-access
  outgoingAuth:
    source: discovered
