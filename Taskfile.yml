version: "3"

silent: true

vars:
  CLUSTER_NAME: toolhive-cedar-demo
  STATE_DIR: "{{.ROOT_DIR}}/.state"
  KUBECONFIG: "{{.STATE_DIR}}/kubeconfig"
  GITHUB_TOKEN_FILE: "{{.STATE_DIR}}/github-token"
  NAMESPACE: toolhive-demo

env:
  KUBECONFIG: "{{.KUBECONFIG}}"

tasks:
  default:
    cmds:
      - task --list

  clean-and-create-github-token-secret:
    desc: Clean and securely load the GitHub token file
    preconditions:
      - sh: test -s "{{.GITHUB_TOKEN_FILE}}"
        msg: "Create {{.GITHUB_TOKEN_FILE}} containing a GitHub token"
    cmds:
      - |
        chmod 600 "{{.GITHUB_TOKEN_FILE}}"
        github_token=$(tr -d '\r\n' < "{{.GITHUB_TOKEN_FILE}}")
        if [ -z "$github_token" ]; then
          echo "GitHub token must not be empty" >&2
          exit 1
        fi
        printf '%s' "$github_token" > "{{.GITHUB_TOKEN_FILE}}"
        unset github_token
        echo "Cleaned GitHub token file {{.GITHUB_TOKEN_FILE}}"
      - task github-secret GITHUB_TOKEN_FILE="{{.GITHUB_TOKEN_FILE}}" KUBECONFIG="{{.KUBECONFIG}}" NAMESPACE="{{.NAMESPACE}}"

  github-secret:
    desc: Load the GitHub token file into Kubernetes
    preconditions:
      - sh: test -s "{{.GITHUB_TOKEN_FILE}}"
        msg: "Create {{.GITHUB_TOKEN_FILE}} containing a GitHub token"
      - sh: |
          last_byte="$(tail -c 1 "{{.GITHUB_TOKEN_FILE}}" | od -An -tx1 | tr -d '[:space:]')"
          test "${last_byte}" != "0a" && test "${last_byte}" != "0d"
        msg: "{{.GITHUB_TOKEN_FILE}} must not end with a newline"
    cmds:
      - |
        echo "Creating Github Token Secret from file.."
        kubectl -n {{.NAMESPACE}} create secret generic github-token \
          --from-file=token="{{.GITHUB_TOKEN_FILE}}" \
          --dry-run=client \
          -o yaml | kubectl apply -f -

  ready:
    desc: Wait for every ToolHive resource to become ready
    cmds:
      - kubectl -n {{.NAMESPACE}} wait --for=condition=Valid mcpoidcconfig/dex --timeout=2m
      - kubectl -n {{.NAMESPACE}} wait --for=condition=Valid mcpauthzconfig/resources-access --timeout=2m
      - kubectl -n {{.NAMESPACE}} wait --for=jsonpath='{.status.phase}'=Ready mcpserver/mkp --timeout=5m
      - kubectl -n {{.NAMESPACE}} wait --for=jsonpath='{.status.phase}'=Ready mcpserver/github --timeout=5m
      - kubectl -n {{.NAMESPACE}} wait --for=jsonpath='{.status.phase}'=Ready mcpgroup/demo-backends --timeout=5m
      - kubectl -n {{.NAMESPACE}} wait --for=jsonpath='{.status.phase}'=Ready virtualmcpserver/cedar-demo --timeout=5m

  forward:
    desc: Expose Dex on :5556 and vMCP on :4483 (blocking)
    cmds:
      - scripts/forward.sh

  token:
    desc: Print a Dex access token (USER defaults to Alice)
    vars:
      USER: '{{.USER | default "alice@example.com"}}'
    cmds:
      - silent: true
        cmd: scripts/get-token.sh "{{.USER}}"

  demo:
    desc: Log in and invoke MKP (USER defaults to Alice)
    vars:
      USER: '{{.USER | default "alice@example.com"}}'
    cmds:
      - scripts/demo.sh "{{.USER}}"

  policy-engineering:
    desc: Allow engineering to call the exposed tools
    cmds:
      - task: apply-policy
        vars:
          POLICY_FILE: policies/engineering-only.yaml

  apply-policy:
    internal: true
    cmds:
      - |
        diff_status=0
        kubectl diff -f "{{.POLICY_FILE}}" >/dev/null 2>&1 || diff_status=$?
        if [ "${diff_status}" -eq 0 ]; then
          echo "Policy is already active"
          exit 0
        fi
        if [ "${diff_status}" -ne 1 ]; then
          kubectl diff -f "{{.POLICY_FILE}}"
          exit "${diff_status}"
        fi

        old_authz_hash="$(kubectl -n {{.NAMESPACE}} get virtualmcpserver/cedar-demo \
          -o jsonpath='{.status.authzConfigHash}' 2>/dev/null || true)"
        old_runconfig_hash="$(kubectl -n {{.NAMESPACE}} get deployment/cedar-demo \
          -o jsonpath='{.spec.template.metadata.annotations.toolhive\.stacklok\.dev/runconfig-checksum}' \
          2>/dev/null || true)"
        kubectl apply -f "{{.POLICY_FILE}}"

        new_authz_hash=""
        attempt=0
        while [ "${attempt}" -lt 120 ]; do
          new_authz_hash="$(kubectl -n {{.NAMESPACE}} get virtualmcpserver/cedar-demo \
            -o jsonpath='{.status.authzConfigHash}' 2>/dev/null || true)"
          if [ -n "${new_authz_hash}" ] && [ "${new_authz_hash}" != "${old_authz_hash}" ]; then
            break
          fi
          attempt=$((attempt + 1))
          sleep 1
        done
        if [ -z "${new_authz_hash}" ] || [ "${new_authz_hash}" = "${old_authz_hash}" ]; then
          echo "Timed out waiting for vMCP to observe the new policy" >&2
          exit 1
        fi

        new_runconfig_hash=""
        attempt=0
        while [ "${attempt}" -lt 120 ]; do
          new_runconfig_hash="$(kubectl -n {{.NAMESPACE}} get deployment/cedar-demo \
            -o jsonpath='{.spec.template.metadata.annotations.toolhive\.stacklok\.dev/runconfig-checksum}' \
            2>/dev/null || true)"
          if [ -n "${new_runconfig_hash}" ] && [ "${new_runconfig_hash}" != "${old_runconfig_hash}" ]; then
            break
          fi
          attempt=$((attempt + 1))
          sleep 1
        done
        if [ -z "${new_runconfig_hash}" ] || [ "${new_runconfig_hash}" = "${old_runconfig_hash}" ]; then
          echo "Timed out waiting for the vMCP deployment update" >&2
          exit 1
        fi
      - kubectl -n {{.NAMESPACE}} rollout status deployment/cedar-demo --timeout=3m

  status:
    desc: Show demo resources and status
    cmds:
      - kubectl -n {{.NAMESPACE}} get pods,services
      - kubectl -n {{.NAMESPACE}} get mcpoidcconfig,mcpauthzconfig,mcpgroup,mcpserver,virtualmcpserver

  versions:
    desc: Show installed charts and container images
    cmds:
      - helm -n toolhive-system list
      - kubectl -n toolhive-system get deployment/toolhive-operator -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}'
      - kubectl -n {{.NAMESPACE}} get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[*].image}{"\n"}{end}'

  logs:
    desc: Show recent operator, vMCP, MKP, GitHub, and Dex logs
    cmds:
      - kubectl -n toolhive-system logs deployment/toolhive-operator --tail=100
      - kubectl -n {{.NAMESPACE}} logs deployment/cedar-demo --tail=100
      - kubectl -n {{.NAMESPACE}} logs deployment/mkp --tail=100
      - kubectl -n {{.NAMESPACE}} logs deployment/github --tail=100
      - kubectl -n {{.NAMESPACE}} logs deployment/dex --tail=100

  down:
    desc: Delete the demo-owned Kind cluster
    cmds:
      - mkdir -p "{{.STATE_DIR}}"
      - |
        set -eu
        if kind get clusters | grep -qx "{{.CLUSTER_NAME}}"; then
          kind get kubeconfig --name "{{.CLUSTER_NAME}}" > "{{.KUBECONFIG}}"
          owner="$(kubectl -n kube-system get configmap/cedar-dex-demo-owner \
            -o jsonpath='{.data.owner}' 2>/dev/null || true)"
          if [ "${owner}" != "toolhive-cedar-demo" ]; then
            echo "Refusing to delete unowned cluster '{{.CLUSTER_NAME}}'." >&2
            exit 1
          fi
          kind delete cluster --name "{{.CLUSTER_NAME}}"
          rm -f "{{.KUBECONFIG}}"
        else
          echo "Kind cluster '{{.CLUSTER_NAME}}' does not exist"
        fi
